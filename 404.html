<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<script>
  // Any unknown address (e.g. ".../app.html/#access_token=..." or a sign-in link that landed on the wrong path)
  // goes to the admin app, keeping the sign-in token that's after the "#".
  (function () {
    var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
    var target = /access_token|type=magiclink|type=signup|app\.html/.test(location.href) ? 'app.html' : '';
    location.replace(base + target + location.search + location.hash);
  })();
</script>
</head>
<body style="font-family:system-ui;padding:40px;text-align:center">Redirecting… <a href="./">Continue</a></body>
</html>
